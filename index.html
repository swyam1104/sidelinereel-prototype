<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SidelineReel: Roster Tagging Safeguards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F7;--sf:#fff;--ink:#0B1F2A;--mu:#5B6B76;--bd:#E3E8E6;--g:#16A34A;--gt:#DCFCE7;--gx:#166534;--a:#F59E0B;--at:#FEF3C7;--ax:#92400E;--r:#DC2626;--rt:#FEE2E2;--rx:#991B1B;--b:#2563EB;--bt:#DBEAFE;--bx:#1E3A8A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1417;--sf:#132026;--ink:#E8F0EE;--mu:#9DB0B8;--bd:#24343B;--gt:#12351F;--gx:#86EFAC;--at:#3A2A08;--ax:#FCD34D;--rt:#3B1414;--rx:#FCA5A5;--bt:#13284F;--bx:#BFDBFE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1417;--sf:#132026;--ink:#E8F0EE;--mu:#9DB0B8;--bd:#24343B;--gt:#12351F;--gx:#86EFAC;--at:#3A2A08;--ax:#FCD34D;--rt:#3B1414;--rx:#FCA5A5;--bt:#13284F;--bx:#BFDBFE;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:"Plus Jakarta Sans",Inter,sans-serif;margin:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font:800 17px "Plus Jakarta Sans",sans-serif}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--g);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mu)}
nav button.on{background:var(--gt);color:var(--gx)}
.bd{background:var(--a);color:#000;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
main{max-width:920px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.fl{border-color:var(--r)}
.ban{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.ban.a{background:var(--at);color:var(--ax)}.ban.g{background:var(--gt);color:var(--gx)}.ban.b{background:var(--bt);color:var(--bx)}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;margin-left:6px}
.chip.g{background:var(--gt);color:var(--gx)}.chip.b{background:var(--bt);color:var(--bx)}.chip.a{background:var(--at);color:var(--ax)}.chip.r{background:var(--rt);color:var(--rx)}.chip.x{background:var(--bd);color:var(--mu)}
.row{display:flex;gap:14px;flex-wrap:wrap}.fx{flex:1;min-width:230px}
.vid{width:200px;max-width:100%;aspect-ratio:16/9;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 40px),linear-gradient(135deg,#14532D,#0B1F2A);position:relative;display:grid;place-items:center;color:#fff;flex:none}
.vid b{font:800 40px "Plus Jakarta Sans",sans-serif;opacity:.55}.vid span{position:absolute;left:8px;bottom:6px;background:rgba(0,0,0,.55);border-radius:6px;padding:0 6px;font-size:12px}
.vid.big{width:100%;aspect-ratio:16/8}.fb{aspect-ratio:16/8;border-radius:12px;background:var(--g);color:#fff;display:grid;place-content:center;text-align:center}.fb b{font:800 56px "Plus Jakarta Sans",sans-serif}
.cd{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.cd i{height:6px;border-radius:9px;background:var(--bd);position:relative;overflow:hidden}.cd i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--g)}.cd em{font-style:normal;color:var(--mu);text-align:right}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.pr{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}button.pr:hover{filter:brightness(.92)}
button.gh,select.gh,button.dn{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}button.dn{border-color:var(--r);color:var(--r)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--b);outline-offset:2px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
td input{width:64px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gt);color:var(--gx);font-weight:600;font-size:12px;margin-right:8px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{border:1px solid var(--bd);background:var(--sf);border-radius:99px;padding:5px 14px;cursor:pointer}.tabs button.on{background:var(--ink);color:var(--bg)}
.par{max-width:430px;margin:0 auto}.mu{color:var(--mu);font-size:14px}.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--g)}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{flex:1;min-width:110px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}.stat b{font:800 24px "Plus Jakarta Sans",sans-serif;display:block}
footer{max-width:920px;margin:0 auto;padding:0 16px 30px;color:var(--mu);font-size:13px}footer label{margin-right:14px}footer a{color:var(--b)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90%}#toast.on{opacity:1}
</style></head>
<body>
<div class="top"><div class="logo"><i>▶</i>SidelineReel</div>
<nav id="nav"></nav></div>
<main id="app"></main>
<footer><div><label><input type="checkbox" id="sent"> Demo: recap already sent</label><label><input type="checkbox" id="nc"> Demo: no confirmed clips</label><button class="gh" id="reset">Reset demo</button></div>
<p>Prototype with fictional data. No real children, footage or personal information. Built for the Ajaia PM assessment · <a href="https://ajaia.ai" target="_blank" rel="noopener">ajaia.ai</a></p></footer>
<div id="toast" role="status"></div>
<script>
const P=[["Ava Brooks",1],["Maya Okafor",4],["Ravi Shah",5],["Lucas Meyer",9],["Isla Romero",10],["Leo Tanaka",11],["Zara Patel",14],["Ben Walker",16],["Chloe Nguyen",20],["Omar Haddad",23],["Priya Nair",27],["Jack O’Neill",32]];
const R=[[12,"Goal",9,3,.98,2,.01],[18,"Save",1,0,.98,5,.01],[23,"Big play",10,4,.96,8,.02],[27,"Goal",4,1,.62,6,.31],[31,"Save",11,5,.74,0,.22],[34,"Big play",23,9,.58,11,.39],[40,"Goal",14,6,.99,1,.01],[44,"Assist",20,8,.95,4,.03],[48,"Big play",14,6,.98,1,.01],[51,"Save",1,0,.99,5,.01],[55,"Big play",16,7,.88,8,.07],[58,"Goal",27,10,.94,7,.03],[63,"Big play",5,2,.93,3,.04],[66,"Goal",11,5,.99,0,.01],[69,"Big play",4,1,.98,6,.01],[73,"Big play",32,11,.98,9,.02]];
const C=R.map((a,i)=>({id:i,min:a[0],type:a[1],det:a[2],top:a[3],tc:a[4],sec:a[5],sc:a[6]}));
const V=new Set(["17","38","56","68","69","08"]);
const init=()=>({tab:"roster",n:P.map(p=>p[1]),res:{},sent:false,noConf:false,child:6,ask:null,flags:0});
let S=init();
const $=s=>document.querySelector(s),fn=i=>P[i][0].split(" ")[0];
function cf(a,b){a=""+a;b=""+b;if(a===b)return false;if(a.length==2&&b.length==2)return a[0]==b[1]&&a[1]==b[0];const[s,d]=a.length<=b.length?[a,b]:[b,a];if(s.length==1&&d.length==2)return d==s+s||d[1]==s;if(s.length==1&&d.length==1)return V.has([s,d].sort().join(""));return false}
const pairs=()=>{const o=[];S.n.forEach((x,i)=>S.n.forEach((y,j)=>{if(i<j&&cf(x,y))o.push([x,y])}));return o};
function route(c){const pair=cf(S.n[c.top],S.n[c.sec]),need=pair?.97:.9;return{pair,need,auto:c.tc>=need-1e-9&&c.tc-c.sc>=.15-1e-9}}
const st=c=>S.res[c.id]?S.res[c.id].k:route(c).auto?"auto":"review";
const owner=c=>{const r=S.res[c.id];return r?(r.k=="conf"?r.to:null):route(c).auto?c.top:null};
function why(c){const r=route(c),p=x=>Math.round(x*100);if(c.tc<r.need-1e-9)return `Confidence ${p(c.tc)}% is below the ${p(r.need)}% we require${r.pair?` because #${S.n[c.top]} and #${S.n[c.sec]} are easy to confuse on video`:""}.`;return `The top two matches are too close to call (${p(c.tc)}% vs ${p(c.sc)}%).`}
const CH={auto:["g","✓ Auto-assigned"],conf:["b","✓ Coach-confirmed"],review:["a","⚠ Needs review"],flag:["r","⚑ Parent flagged"],excl:["x","✕ Excluded"]};
const chip=k=>`<span class="chip ${CH[k][0]}">${CH[k][1]}</span>`;
const vid=(c,big)=>`<div class="vid ${big?"big":""}"><b>#${c.det}</b><span>▶ ${c.min}’</span></div>`;
const queue=()=>C.filter(c=>["flag","review"].includes(st(c))).sort((a,b)=>(st(b)=="flag")-(st(a)=="flag")||a.min-b.min);
const done=()=>C.filter(c=>["conf","excl"].includes(st(c)));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
const opts=()=>P.map((p,i)=>`<option value="${i}">#${S.n[i]} ${p[0]}</option>`).join("");
const cand=(i,v)=>`<div class="cd"><span>#${S.n[i]} ${P[i][0]}</span><i style="--w:${v*100}%"></i><em>${Math.round(v*100)}%</em></div>`;

function roster(){const ps=pairs();return `<h2>Ridgeline U12 Blue · Roster</h2><p class="mu">Check numbers before the next upload.</p>
${ps.length?`<div class="ban a">⚠ ${ps.length} pair${ps.length>1?"s":""} of jersey numbers ${ps.length>1?"are":"is"} easy to confuse on video: ${ps.map(p=>`#${p[0]} &amp; #${p[1]}`).join(", ")}. We’ll ask you to double-check uncertain clips for these players. This doesn’t stop you from saving.</div>`:`<div class="ban g">✓ No easy-to-confuse numbers found.</div>`}
<div class="card"><table><tr><th>Player</th><th>Number</th><th></th></tr>${P.map((p,i)=>{const w=S.n.map((x,j)=>j!=i&&cf(S.n[i],x)?x:null).filter(x=>x);return `<tr><td><span class="av">${p[0].split(" ").map(x=>x[0]).join("")}</span>${p[0]}</td><td><input data-i="${i}" value="${S.n[i]}" inputmode="numeric" maxlength="2" aria-label="Jersey number for ${p[0]}"></td><td>${w.length?`<span class="chip a">⚠ Easy to confuse with ${w.map(x=>"#"+x).join(", ")}</span>`:""}</td></tr>`}).join("")}</table>
<details><summary class="mu">How we decide</summary><p class="mu">We flag numbers that are digit swaps (23 and 32), a single digit and a two-digit number that repeats or ends with it (1 and 11, 4 and 14), or look alike (1/7, 3/8, 5/6, 6/8, 6/9, 0/8).</p></details>
<div class="act"><button class="pr" data-a="save">Save roster and continue</button></div></div>`}

function review(){const q=queue(),d=done(),n=C.filter(c=>st(c)!="auto"&&st(c)!="conf"&&st(c)!="excl").length,auto=C.filter(c=>st(c)=="auto").length,tab=S.rtab||"q";
const card=(c,k)=>{const f=k=="flag",r=S.res[c.id],cc=S.res[c.id];return `<div class="card ${f?"fl":""}"><div class="row">${vid(c)}<div class="fx"><h4>${c.type} · ${c.min}’ ${chip(k)}</h4>
${f?`<p class="mu">Detected #${c.det}. Removed from ${fn(r.from)}’s reel after a parent tapped “Not my kid”.</p>`:`<p class="mu">Detected number #${c.det}</p>${cand(c.top,c.tc)}${cand(c.sec,c.sc)}<details><summary class="mu">Why is this here?</summary><p class="mu">${why(c)}</p></details>`}
<div class="act">${f?`<button class="pr" data-a="ret" data-c="${c.id}">Return to ${fn(r.from)}’s reel</button>`:`<button class="pr" data-a="ok" data-c="${c.id}">Confirm #${S.n[c.top]} ${fn(c.top)}</button>`}<select class="gh" data-a="re" data-c="${c.id}" aria-label="Reassign"><option value="">Reassign…</option>${opts()}</select><button class="gh" data-a="ex" data-c="${c.id}">Exclude</button></div></div></div></div>`};
return `<h2>vs Harbor FC · This week’s game</h2><div class="stats"><div class="stat"><b>${C.length}</b>clips found</div><div class="stat"><b>${auto}</b>auto-assigned</div><div class="stat"><b>${n}</b>need your review</div></div>
<div class="bar" title="resolved"><i style="width:${Math.round(100*d.length/Math.max(1,d.length+q.length))}%"></i></div>
<div class="ban b">${S.sent?"Recap sent. Clips you confirm now are added to the child’s reel in the app. No new notification is sent.":"Weekly recap sends Sunday 9:00 AM. Clips you haven’t resolved will be left out. The recap is never delayed."}</div>
<div class="tabs"><button class="${tab=="q"?"on":""}" data-a="rt" data-v="q">Needs review (${q.length})</button><button class="${tab=="d"?"on":""}" data-a="rt" data-v="d">Resolved (${d.length})</button></div>
${tab=="q"?(q.length?q.map(c=>card(c,st(c))).join(""):`<div class="ban g">All clear. Every clip is confirmed and the recap is ready to send.</div>`):(d.length?d.map(c=>`<div class="card"><div class="row"><div class="fx"><h4>${c.type} · ${c.min}’ ${chip(st(c))}</h4><p class="mu">${st(c)=="conf"?"Assigned to #"+S.n[S.res[c.id].to]+" "+P[S.res[c.id].to][0]:"Left out of every reel"}</p></div><button class="gh" data-a="undo" data-c="${c.id}">Undo</button></div></div>`).join(""):`<p class="mu">Nothing resolved yet.</p>`)}`}

function parent(){const k=S.child,mine=C.filter(c=>owner(c)==k),h=mine[0],unres=C.some(c=>["review","flag"].includes(st(c)));
return `<div class="par"><label class="mu">Viewing as parent of: <select class="gh" data-a="child">${P.map((p,i)=>`<option value="${i}" ${i==k?"selected":""}>#${S.n[i]} ${p[0]}</option>`).join("")}</select></label>
<div class="card">${(!h||S.noConf)?`<div class="fb"><b>#${S.n[k]}</b><span>${P[k][0]}</span><em>Highlights coming soon</em></div>`:vid(h,1)}
<h3 style="margin-top:10px">${fn(k)}’s highlights · Week 6</h3><p class="mu">${mine.length} highlight${mine.length==1?"":"s"} · vs Harbor FC</p>
<div class="act"><button class="pr" data-a="play">▶ Play reel</button><button class="gh" data-a="share">Share</button></div></div>
${mine.length?mine.map(c=>`<div class="card"><div class="row">${vid(c)}<div class="fx"><h4>${c.type} · ${c.min}’</h4>${st(c)=="conf"?`<p class="mu">✓ Verified by your coach</p>`:""}
${S.ask==c.id?`<p>Remove this clip from ${fn(k)}’s reel? Your coach will review it and put it in the right reel.</p><div class="act"><button class="dn" data-a="rm" data-c="${c.id}">Remove clip</button><button class="gh" data-a="no">Cancel</button></div>`:`<div class="act"><button class="dn" data-a="ask" data-c="${c.id}">⚑ Not my kid</button></div>`}</div></div></div>`).join(""):`<p class="mu">No highlights yet this week.</p>`}
${unres?`<p class="mu">Missing a highlight? Your coach is still confirming a few clips. They’ll show up here once confirmed.</p>`:""}</div>`}

function health(){const cnt=k=>C.filter(c=>st(c)==k).length,rv=C.filter(c=>route(c).auto==false).length;
return `<h2>Product health</h2><p class="mu">Live counters from this demo, plus figures from the assessment brief (illustrative).</p>
<div class="stats"><div class="stat"><b>${cnt("auto")}</b>auto-assigned</div><div class="stat"><b>${cnt("review")+cnt("flag")}</b>need review</div><div class="stat"><b>${cnt("conf")+cnt("excl")}</b>resolved</div><div class="stat"><b>${S.flags}</b>parent flags</div></div>
<div class="card"><h4>Coach workload</h4><p>${Math.round(100*rv/C.length)}% of clips routed to review. Target: 25% or less on rosters with confusable numbers.</p></div>
<div class="card"><h4>A metric that looks better than it is</h4><p class="mu">Reported share rate: 92% (opened reels only)</p><div class="bar"><i style="width:92%"></i></div><p class="mu">Across all generated reels: about 64%</p><div class="bar"><i style="width:64%"></i></div><p class="mu">0.92 × 0.70 ≈ 0.64. About 30% of reels are never opened (dashboard note in the brief).</p></div>
<div class="card"><h4>Targets</h4><p class="mu">Wrong-kid rate at least 75% below baseline and 1% or lower in audit · open rate 80% or higher · recap timeliness 100% · thin reels no more than 5 points above baseline.</p></div>`}

function render(){const n=queue().length;$("#nav").innerHTML=[["roster","1 Roster"],["review","2 Review queue"+(n?`<span class="bd">${n}</span>`:"")],["parent","3 Parent reel"],["health","Product health"]].map(t=>`<button class="${S.tab==t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join("");
$("#app").innerHTML={roster,review,parent,health}[S.tab]();$("#sent").checked=S.sent;$("#nc").checked=S.noConf}

function act(a,d){const c=C[d.c];
if(a=="tab")S.tab=d.v;else if(a=="rt")S.rtab=d.v;
else if(a=="save"){S.tab="review";toast("Roster saved")}
else if(a=="ok"){S.res[c.id]={k:"conf",to:c.top};toast(`Added to ${fn(c.top)}’s reel`+(S.sent?". No new notification sent.":""))}
else if(a=="ex"){S.res[c.id]={k:"excl"};toast("Excluded from all reels")}
else if(a=="ret"){const f=S.res[c.id].from;S.res[c.id]={k:"conf",to:f};toast(`Returned to ${fn(f)}’s reel`)}
else if(a=="undo"){delete S.res[c.id];toast("Undone")}
else if(a=="ask")S.ask=c.id;else if(a=="no")S.ask=null;
else if(a=="rm"){S.res[c.id]={k:"flag",from:S.child};S.ask=null;S.flags++;toast("Thanks. Removed. Your coach will check it.")}
else if(a=="share")toast("Link copied");else if(a=="play")toast("Playing reel (demo)");
render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&!["SELECT","INPUT"].includes(t.tagName))act(t.dataset.a,t.dataset)});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.i!==undefined){const i=+t.dataset.i,v=t.value.trim(),u=S.n.findIndex((x,j)=>j!=i&&x==v);if(!/^\d{1,2}$/.test(v))toast("Use a 1 or 2 digit number");else if(u>=0)toast(`Number already used by ${P[u][0]}`);else S.n[i]=""+ +v;render()}
else if(t.dataset.a=="re"&&t.value!==""){const c=C[t.dataset.c];S.res[c.id]={k:"conf",to:+t.value};toast(`Added to ${fn(+t.value)}’s reel`+(S.sent?". No new notification sent.":""));render()}
else if(t.dataset.a=="child"){S.child=+t.value;S.ask=null;render()}
else if(t.id=="sent"){S.sent=t.checked;render()}else if(t.id=="nc"){S.noConf=t.checked;render()}});
$("#reset").onclick=()=>{S=init();render();toast("Demo reset")};
render();
</script></body></html>
